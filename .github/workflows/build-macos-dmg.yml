# macOS 用 .dmg を GitHub の Mac（Apple Silicon）でビルドする。
# - 「Actions」タブ →「Build macOS DMG」→「Run workflow」で手動実行
#   （release_tag にタグ名を入れると、その Release の DMG を差し替える）
# - v から始まるタグ（例: v0.1.0）を push すると Release に .dmg を添付
#
# 署名・公証（任意）: リポジトリの Settings → Secrets and variables → Actions に次を登録すると、
# Developer ID 署名と Apple の公証を行い、ダウンロードした Mac で警告が出なくなる。
#   MACOS_CERT_P12_BASE64  Developer ID Application 証明書（.p12）を base64 にしたもの
#   MACOS_CERT_PASSWORD    .p12 のパスワード
#   MACOS_SIGN_IDENTITY    "Developer ID Application: 氏名 (TEAMID)"
#   APPLE_ID / APPLE_TEAM_ID / APPLE_APP_PASSWORD  公証用
name: Build macOS DMG

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "既存の Release に DMG を添付し直す場合のタグ名（例: v0.1.1）。空ならビルドのみ"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest  # Apple Silicon (arm64)
    timeout-minutes: 60
    env:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      RELEASES_REPO_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import Developer ID certificate
        if: env.MACOS_CERT_P12_BASE64 != '' && env.MACOS_SIGN_IDENTITY != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(openssl rand -hex 16)"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build .app and .dmg
        env:
          PYTHON: python
        run: |
          if [ -z "$MACOS_CERT_P12_BASE64" ]; then unset MACOS_SIGN_IDENTITY; fi
          ./scripts/build_mac_app.sh --no-install

      - name: Self-test bundled app
        env:
          SSAI_SELFTEST: "1"
        run: |
          "dist/Speech Summarizer AI.app/Contents/MacOS/SpeechSummarizerAI" | tee "$RUNNER_TEMP/selftest.log"
          # 自動アップデートは版数で判定するため、.app の版数が pyproject.toml と一致することを確認する
          WANT="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          GOT="$(sed -n 's/.*OK   version //p' "$RUNNER_TEMP/selftest.log")"
          echo "pyproject=$WANT app=$GOT"
          test "$WANT" = "$GOT"
          if [ -n "$RELEASE_TAG" ]; then test "v$WANT" = "$RELEASE_TAG" || { echo "タグ $RELEASE_TAG と pyproject の版数 $WANT が一致しません"; exit 1; }; fi

      # 配布する .app そのもので自動アップデート（確認→ダウンロード→照合→入れ替え→再起動）を通す。
      # 失敗したら配信しない（壊れた更新機能を出すと、次の版を自動で届けられなくなるため）。
      - name: E2E test of automatic update
        run: ./scripts/e2e_update_test.sh "dist/Speech Summarizer AI.app"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: SpeechSummarizerAI-macOS-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Write release notes
        if: env.RELEASE_TAG != ''
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'MD'
          ## インストール（Apple Silicon の Mac 専用）

          1. 下の **Assets** から `SpeechSummarizerAI-*-arm64.dmg` をダウンロードして開きます。
          2. 「Speech Summarizer AI」を「Applications」フォルダへドラッグします。
          3. アプリケーションフォルダから開き、マイクへのアクセスを「許可」します。

          インストール後は、新しいバージョンが出るとアプリが自動でお知らせし、ワンクリックで更新できます。

          ### 「開けません」「マルウェアが含まれていないことを検証できません」と出たら

          このアプリは Apple の公証を受けていないため、初回だけ許可が必要です。**ダイアログでは「ゴミ箱に入れる」ではなく「完了」を押してください。**

          - **方法A:** 「システム設定」→「プライバシーとセキュリティ」→ 下の方の「このまま開く」→ もう一度アプリを開いて「このまま開く」
          - **方法B（ターミナルで 1 行）:**
            ```
            xattr -dr com.apple.quarantine "/Applications/Speech Summarizer AI.app"
            ```

          初回起動時に AI モデルをダウンロードします。音声・文字起こし・要約はこの Mac の中だけで処理されます。
          MD

      - name: Attach DMG to release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*.dmg
          body_path: ${{ runner.temp }}/notes.md

      # 自動アップデートの配信先（公開リポジトリ）にも載せる。
      # Secret RELEASES_REPO_TOKEN（配布用リポジトリだけに Contents: Read and write を許可したトークン）が必要。
      - name: Publish to public releases repository (auto-update)
        if: env.RELEASE_TAG != '' && env.RELEASES_REPO_TOKEN != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: bright-broom/summarizeAI-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          tag_name: ${{ env.RELEASE_TAG }}
          name: Speech Summarizer AI ${{ env.RELEASE_TAG }}
          files: dist/*.dmg
          body_path: ${{ runner.temp }}/notes.md
