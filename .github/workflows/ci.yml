# PR と main への push ごとに、静的チェックとテストを実行する（数分）。
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (syntax errors / undefined or unused names)
        run: ruff check --select E9,F src tests scripts

      - name: Tests
        run: pytest -q
